# Install as /etc/systemd/system/go2-camera-source.service.d/20-camera-rate.conf.
# The command mirrors the deployed go2-camera-source.service and raises only
# the source frame-rate limit from 2 FPS to 5 FPS.
[Service]
ExecStart=
ExecStart=/bin/bash -c '. /opt/ros/foxy/setup.bash && . /home/unitree/cyclonedds_ws/install/setup.bash && exec /usr/bin/python3 /home/unitree/projects/dimos/go2_camera_image_source.py --ros-args -p interface:=eth10 -p target_fps:=5.0 -p width:=640 -p height:=360 -p jpeg_quality:=70'
